# Render Blueprint — deploys the api and ui services from the existing
# Dockerfiles, unchanged. No infrastructure beyond the two containers this
# project already has: no database, no queue, no extra services.
#
# To use: on render.com, "New +" -> "Blueprint" -> select this repository.
# Render reads this file and creates both services below. Nothing here can
# contain a secret — API keys are entered in the Render dashboard after
# import (see envVars: sync: false), never committed to this file or the
# repo. Both services build directly from Dockerfile.api / Dockerfile.ui,
# so they behave exactly like `docker compose up` locally.

services:
  - type: web
    name: ai-data-analyst-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Set these in the Render dashboard after import — never in this
      # file. Only one provider is required; set its key and leave the
      # other blank.
      - key: LLM_PROVIDER
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        sync: false
      # Optional: restrict CORS to the deployed UI's URL once you know it.
      # The browser talks to the UI, not this API, directly — see the
      # README — so this mainly matters for hitting /docs from a browser.
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ai-data-analyst-ui
    env: docker
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    plan: free
    envVars:
      # Fill in after the api service has deployed and you have its URL,
      # e.g. https://ai-data-analyst-api.onrender.com (no trailing slash).
      - key: ANALYST_API_URL
        sync: false
