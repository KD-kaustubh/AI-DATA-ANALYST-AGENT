[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analyst-agent"
version = "0.1.0"
description = "An AI-powered data analysis assistant for natural-language interaction with structured datasets."
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    # Our own code must not warn.
    "error",
    # Deprecations raised inside starlette's test client and its dependencies.
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:anyio.*",
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
